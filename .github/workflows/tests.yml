name: Local tests
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The IAM regression compares the current template with its reviewed
          # ancestor; the merge's first commit alone does not contain that blob.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --extra foundation-runtime
      - run: npm --prefix frontend ci
      - run: uv run --locked --extra foundation-runtime pytest -q
      - run: npm --prefix frontend run build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npx --prefix frontend playwright test --config frontend/playwright.config.ts
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: npx --prefix frontend playwright test --config frontend/playwright.journey.config.ts
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: |
            artifacts/test-results
            artifacts/journey-browser
          retention-days: 7
