[project]
name = "governed-agent-builder"
version = "0.1.0"
description = "A local-first governed agent builder, with explicit simulation boundaries"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "boto3>=1.37,<2",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.28,<1",
    "mangum>=0.19,<1",
    "urllib3==2.7.0",
]

[project.optional-dependencies]
research-runtime = ["bedrock-agentcore>=1.0,<2"]
foundation-runtime = [
    "bedrock-agentcore==1.22.0",
    "jsonschema==4.26.0",
    "opentelemetry-exporter-otlp-proto-http==1.40.0",
    "opentelemetry-sdk==1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "moto[dynamodb,s3,sqs]>=5,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
